[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "med-agent"
version = "0.1.0"
description = "Medical PDF translation agent workspace"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
